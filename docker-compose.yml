services:
  vote:
    image: ${ACR_LOGIN_SERVER:?Set ACR_LOGIN_SERVER}/voting-app-vote:${IMAGE_TAG:-latest}
    ports:
      - "5000:80"
    networks: [front-tier, back-tier]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 12
  result:
    image: ${ACR_LOGIN_SERVER:?Set ACR_LOGIN_SERVER}/voting-app-result:${IMAGE_TAG:-latest}
    ports:
      - "5001:80"
    networks: [front-tier, back-tier]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 12
  worker:
    image: ${ACR_LOGIN_SERVER:?Set ACR_LOGIN_SERVER}/voting-app-worker:${IMAGE_TAG:-latest}
    networks: [back-tier]
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
  redis:
    image: redis:alpine
    networks: [back-tier]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [back-tier]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  db-data:
networks:
  front-tier:
  back-tier:
