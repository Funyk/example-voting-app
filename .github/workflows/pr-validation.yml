name: PR Validation Gate (CI)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Baseline: show real HIGH/CRITICAL findings before enabling the hard gate.
  TRIVY_SEVERITY: HIGH,CRITICAL
  TRIVY_EXIT_CODE: '0'
  TRIVY_IGNORE_UNFIXED: 'false'

jobs:
  lint-and-sast:
    name: Linters & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint vote Dockerfile with Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: vote/Dockerfile
          failure-threshold: error
      - name: Lint result Dockerfile with Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: result/Dockerfile
          failure-threshold: error
      - name: Lint worker Dockerfile with Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: worker/Dockerfile
          failure-threshold: error
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Run Flake8 and Bandit
        run: |
          python -m pip install flake8 bandit
          flake8 ./vote --count --select=E9,F63,F7,F82 --show-source --statistics
          bandit -r ./vote -ll
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '7.0.x'
      - name: C# compiler and built-in static analyzers
        working-directory: worker
        run: dotnet build -c Release -p:EnableNETAnalyzers=true -p:AnalysisLevel=latest

  unit-tests-and-build:
    name: Dependencies, Unit Tests & Artifact Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python and pip cache
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: vote/requirements.txt
      - name: Install Vote dependencies and run unit tests
        working-directory: vote
        run: |
          python -m pip install -r requirements.txt pytest
          pytest test_app.py -v --junitxml=../reports/pytest.xml
      - name: Set up Node.js and npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: result/package-lock.json
      - name: Install Result dependencies and validate actual JavaScript files
        working-directory: result
        run: |
          npm ci
          node --check server.js
          node --check tests/render.js
          node --check views/app.js
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '7.0.x'
      - name: Restore, build and publish Worker release artifact
        working-directory: worker
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore
          dotnet publish -c Release --no-restore -o ./out
      - name: Upload compiled Worker artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-release-binaries
          path: worker/out/
          retention-days: 3
          if-no-files-found: error
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-results
          path: reports/pytest.xml
          retention-days: 3

  docker-build-and-security-scan:
    name: Docker Build (Dry-Run) & Trivy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [lint-and-sast, unit-tests-and-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build all three images locally without pushing
        id: build
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          mkdir -p reports
          for service in vote result worker; do
            docker build --pull -t "local/voting-app-$service:pr-$PR_NUMBER" "./$service"
          done
      - name: Trivy repository dependency scan
        id: trivy-fs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: ${{ env.TRIVY_IGNORE_UNFIXED }}
          exit-code: ${{ env.TRIVY_EXIT_CODE }}
          timeout: 10m
      - name: Trivy vote container scan
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: local/voting-app-vote:pr-${{ github.event.number }}
          scanners: vuln
          format: table
          vuln-type: os,library
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: ${{ env.TRIVY_IGNORE_UNFIXED }}
          exit-code: ${{ env.TRIVY_EXIT_CODE }}
          timeout: 10m
      - name: Trivy result container scan
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: local/voting-app-result:pr-${{ github.event.number }}
          scanners: vuln
          format: table
          vuln-type: os,library
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: ${{ env.TRIVY_IGNORE_UNFIXED }}
          exit-code: ${{ env.TRIVY_EXIT_CODE }}
          timeout: 10m
      - name: Trivy worker container scan
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: local/voting-app-worker:pr-${{ github.event.number }}
          scanners: vuln
          format: table
          vuln-type: os,library
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: ${{ env.TRIVY_IGNORE_UNFIXED }}
          exit-code: ${{ env.TRIVY_EXIT_CODE }}
          timeout: 10m
      - name: Save complete scanner evidence as JSON and text
        if: ${{ always() && steps.build.outcome == 'success' }}
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed=false --format json --exit-code 0 --timeout 10m --output reports/trivy-fs.json .
          for service in vote result worker; do
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed=false --format json --exit-code 0 --timeout 10m \
              --output "reports/trivy-$service.json" "local/voting-app-$service:pr-$PR_NUMBER"
          done
          for report in reports/trivy-*.json; do
            trivy convert --format table --output "${report%.json}.txt" "$report"
          done
      - name: Upload Trivy reports even when the security gate fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-security-reports
          path: reports/trivy-*
          retention-days: 7
          if-no-files-found: error
